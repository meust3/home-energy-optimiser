[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "home-energy-optimiser"
version = "0.6.4"
description = "Read-only home energy data collection and optimisation for Home Assistant, Amber Electric, Solcast, and GoodWe."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "pydantic>=2.8",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "rich>=13.7",
    "SQLAlchemy>=2.0,<3",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
ai = [
    "ai-control-panel-client @ git+https://github.com/meust3/AI_Control_Planel.git@17453cb65f8ff7714b203aba8d2a7b964cb3f09c#subdirectory=packages/client-python",
]
dev = [
    "black>=24.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
energy_optimizer = ["dashboard_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
