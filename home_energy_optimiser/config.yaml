name: Home Energy Optimiser
version: "0.4.1"
slug: home_energy_optimiser
description: Read-only energy dashboard and five-minute PostgreSQL collector
url: https://github.com/meust3/home-energy-optimiser
arch:
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
watchdog: http://[HOST]:[PORT:8099]/health
ingress: true
ingress_port: 8099
panel_icon: mdi:home-lightning-bolt
panel_title: Energy Optimiser
panel_admin: true
stage: experimental
options:
  db_port: 55432
  db_name: home_energy
  db_user: energy_app
  timezone: Australia/Brisbane
  health_max_observation_age_seconds: 900
  grid_power_sign: unknown
  battery_power_sign: unknown
  sign_convention_confidence: unconfirmed
  sign_convention_supporting_samples: 0
  balance_tolerance_w: 250
  ev_vehicle_enabled: false
  ev_charging_entity: ""
  ev_plugged_entity: ""
  ev_online_entity: ""
  ev_soc_entity: ""
  ev_battery_power_entity: ""
  ev_telemetry_updated_entity: ""
  ev_location_entity: ""
  ev_home_state: home
  ev_telemetry_stale_seconds: 900
schema:
  db_host: str
  db_port: port
  db_name: str
  db_user: str
  db_password: password
  timezone: str
  health_max_observation_age_seconds: int(300,3600)
  grid_power_sign: list(unknown|positive_export|positive_import)
  battery_power_sign: list(unknown|positive_discharge|positive_charge)
  sign_convention_confidence: list(unconfirmed|low|medium|high)
  sign_convention_supporting_samples: int(0,)
  balance_tolerance_w: float(0.001,)
  ev_vehicle_enabled: bool
  ev_charging_entity: str
  ev_plugged_entity: str
  ev_online_entity: str
  ev_soc_entity: str
  ev_battery_power_entity: str
  ev_telemetry_updated_entity: str
  ev_location_entity: str
  ev_home_state: str
  ev_telemetry_stale_seconds: int(1,86400)
