name: Home Energy Optimiser
version: "0.5.0"
slug: home_energy_optimiser
description: Read-only energy dashboard and five-minute PostgreSQL collector
url: https://github.com/meust3/home-energy-optimiser
arch:
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
watchdog: http://[HOST]:[PORT:8099]/health
ingress: true
ingress_port: 8099
panel_icon: mdi:home-lightning-bolt
panel_title: Energy Optimiser
panel_admin: true
stage: experimental
options:
  db_port: 55432
  db_name: home_energy
  db_user: energy_app
  timezone: Australia/Brisbane
  health_max_observation_age_seconds: 900
  ev_vehicle_enabled: false
  ev_charging_entity: ""
  ev_plugged_entity: ""
  ev_online_entity: ""
  ev_soc_entity: ""
  ev_battery_power_entity: ""
  ev_telemetry_updated_entity: ""
  ev_location_entity: ""
  ev_home_state: home
  ev_telemetry_stale_seconds: 900
  forecast_operations_enabled: false
  forecast_interval_minutes: 30
  forecast_horizon_hours: 24
  forecast_alignment_minutes: 30
  forecast_scoring_delay_minutes: 10
  forecast_max_runtime_seconds: 120
  reserve_snapshot_enabled: true
schema:
  db_host: str
  db_port: port
  db_name: str
  db_user: str
  db_password: password
  timezone: str
  health_max_observation_age_seconds: int(300,3600)
  ev_vehicle_enabled: bool
  ev_charging_entity: str
  ev_plugged_entity: str
  ev_online_entity: str
  ev_soc_entity: str
  ev_battery_power_entity: str
  ev_telemetry_updated_entity: str
  ev_location_entity: str
  ev_home_state: str
  ev_telemetry_stale_seconds: int(1,86400)
  forecast_operations_enabled: bool
  forecast_interval_minutes: int(15,1440)
  forecast_horizon_hours: int(1,168)
  forecast_alignment_minutes: int(5,60)
  forecast_scoring_delay_minutes: int(0,1440)
  forecast_max_runtime_seconds: int(30,900)
  reserve_snapshot_enabled: bool
