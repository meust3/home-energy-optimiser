configuration:
  db_host:
    name: PostgreSQL host
    description: DNS name or LAN address of the external PostgreSQL server.
  db_port:
    name: PostgreSQL port
    description: External PostgreSQL TCP port.
  db_name:
    name: Database name
    description: Canonical production database.
  db_user:
    name: Database user
    description: Least-privilege application role.
  db_password:
    name: Database password
    description: Password for the application role; never written to logs.
  timezone:
    name: Local timezone
    description: IANA timezone used for local observation timestamps.
  health_max_observation_age_seconds:
    name: Maximum observation age
    description: Age after which collector health becomes unhealthy.
  grid_power_sign:
    name: Grid power sign
    description: Confirmed direction represented by positive raw grid power; leave unknown until validated.
  battery_power_sign:
    name: Battery power sign
    description: Confirmed direction represented by positive raw battery power; leave unknown until validated.
  sign_convention_confidence:
    name: Sign confidence
    description: Confidence assigned to the validated grid and battery sign pair.
  sign_convention_supporting_samples:
    name: Supporting samples
    description: Number of observations used to validate the configured sign pair.
  balance_tolerance_w:
    name: Balance tolerance
    description: Positive watt tolerance used by the unchanged energy-balance check.
  ev_vehicle_enabled:
    name: Enable vehicle telemetry
    description: Read configured vehicle entities without enabling any control action.
  ev_charging_entity:
    name: Vehicle charging entity
    description: Optional binary sensor that directly reports active charging.
  ev_plugged_entity:
    name: Vehicle plugged entity
    description: Optional binary sensor that reports whether the vehicle is plugged in.
  ev_online_entity:
    name: Vehicle online entity
    description: Optional binary sensor used as vehicle-cloud availability context.
  ev_soc_entity:
    name: Vehicle SOC entity
    description: Optional sensor reporting vehicle battery percentage.
  ev_battery_power_entity:
    name: Raw vehicle battery power entity
    description: Optional vehicle-side raw power sensor; it is not charger AC demand.
  ev_telemetry_updated_entity:
    name: Vehicle telemetry timestamp entity
    description: Optional sensor containing a timezone-aware telemetry update timestamp.
  ev_location_entity:
    name: Vehicle location-state entity
    description: Optional tracker used only to derive home versus away; coordinates are ignored.
  ev_home_state:
    name: Home state value
    description: Entity state that means the vehicle is at home.
  ev_telemetry_stale_seconds:
    name: Vehicle telemetry freshness
    description: Maximum vehicle telemetry age before its charging state becomes unknown.
  forecast_operations_enabled:
    name: Enable forecast operations
    description: Opt in to the bounded advisory in-process forecast coordinator.
  forecast_interval_minutes:
    name: Forecast interval
    description: Minutes between aligned scheduled forecast attempts.
  forecast_horizon_hours:
    name: Forecast horizon
    description: Hours covered by each genuine scheduled baseline forecast.
  forecast_alignment_minutes:
    name: Forecast alignment
    description: Valid local wall-clock boundary alignment in minutes.
  forecast_scoring_delay_minutes:
    name: Scoring delay
    description: Delay after an interval completes before its actual is scored.
  forecast_max_runtime_seconds:
    name: Maximum forecast runtime
    description: Cooperative deadline for one forecast and reserve cycle.
  reserve_snapshot_enabled:
    name: Persist reserve snapshots
    description: Store complete advisory reserve results after successful forecasts.
